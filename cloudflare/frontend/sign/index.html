<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>契約書への署名</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>📑 電子契約への署名</h1></header><main class="wrap"><div id="message"></div><section id="sign" class="card hidden"><h2 id="title"></h2><p>署名者: <strong id="signer"></strong></p><p class="hash">原本SHA-256: <span id="hash"></span></p><iframe id="pdf" title="契約書PDF"></iframe><h3>署名の実行</h3><form id="form"><label>登録されている署名者名を正確に入力してください<input name="typedName" required></label><label><input name="confirmed" type="checkbox" style="width:auto" required> 契約書の内容を確認し、同意します</label><br><br><button>署名して完了する</button></form></section><section id="done" class="card hidden"><h2>署名が完了しました</h2><a id="signedPdf" class="button" target="_blank">署名済契約書</a> <a id="certificate" class="button secondary" target="_blank">締結証明書</a></section></main><script type="module" src="/sign/sign.js"></script></body></html>
