<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal E-Contract</title><link rel="stylesheet" href="/styles.css?v=20260917-2"></head><body>
<header><h1>📑 Minimal E-Contract — Cloudflare PoC</h1><button id="logout" class="secondary hidden">ログアウト</button></header>
<main class="wrap">
  <section id="login" class="card"><h2>管理者ログイン</h2><form id="loginForm"><label>ユーザー名<input name="username" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form><div id="loginMessage"></div></section>
  <section id="app" class="hidden"><div class="tabs"><button data-view="contracts" class="active">契約一覧</button><button data-view="create">新規契約</button><button data-view="audit">監査ログ</button></div>
    <div id="contracts" class="card"><h2>契約一覧</h2><div id="contractMessage"></div><table><thead><tr><th>件名</th><th>署名者</th><th>状態</th><th>作成日時</th><th>操作</th></tr></thead><tbody id="contractRows"></tbody></table></div>
    <div id="create" class="card hidden"><h2>新規契約作成</h2><form id="createForm" novalidate><div class="grid"><label>契約件名<input name="title" required></label><label>発行者・会社名<input name="companyName" required></label><label>署名者名<input name="signerName" required></label><label>署名者メール<input name="signerEmail" type="text" inputmode="email" autocomplete="off" required></label></div><label>契約書PDF<input name="pdf" type="file" accept="application/pdf" required></label><button>下書きを作成</button></form><div id="createMessage"></div></div>
    <div id="audit" class="card hidden"><h2>監査ログ</h2><p>各レコードは直前のハッシュを含む改ざん検知チェーンです。</p><table><thead><tr><th>日時</th><th>操作</th><th>実行者</th><th>Previous → Current</th></tr></thead><tbody id="auditRows"></tbody></table></div>
  </section>
</main><script type="module" src="/app.js?v=20260917-2"></script></body></html>
