name: Cloudflare PoC
permissions:
  contents: read
concurrency:
  group: cloudflare-poc-production
  cancel-in-progress: false
on:
  push:
    branches: [poc/cloudflare-workers-pages]
    paths: ['cloudflare/**', '.github/workflows/cloudflare-poc.yml']
  pull_request:
    paths: ['cloudflare/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloudflare } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloudflare/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  deploy-worker:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: cloudflare } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloudflare/package-lock.json }
      - run: npm ci
      - run: npm run db:migrate:remote
      - run: npm run deploy:worker
      - run: npm run deploy:pages
